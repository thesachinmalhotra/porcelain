name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Redpanda Connect
        run: |
          docker run -d --name porcelain-connect -p 4195:4195 docker.redpanda.com/redpandadata/connect:4.109.0 streams
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4195/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs porcelain-connect
          exit 1

      - name: Install rpk and pin Connect CLI
        run: |
          curl -LO https://github.com/redpanda-data/redpanda/releases/latest/download/rpk-linux-amd64.zip
          mkdir -p "$HOME/.local/bin"
          unzip -o rpk-linux-amd64.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rpk" connect install --connect-version 4.109.0 --force
          "$HOME/.local/bin/rpk" connect --version

      - name: Verify
        run: npm run verify

      - name: Stop Redpanda Connect
        if: always()
        run: docker rm -f porcelain-connect || true
